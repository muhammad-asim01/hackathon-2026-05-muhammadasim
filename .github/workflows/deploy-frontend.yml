name: Deploy Frontend → Vercel (Production)

# ── Trigger ───────────────────────────────────────────────────────────────────
# Runs ONLY when code lands on main (direct push or merged PR).
# All other branches are ignored.
on:
  push:
    branches:
      - main
    paths:
      - "main-project/frontend/**"
      - ".github/workflows/deploy-frontend.yml"

# ── Permissions ───────────────────────────────────────────────────────────────
permissions:
  contents: read
  deployments: write

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: main-project/frontend

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node ────────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: main-project/frontend/package-lock.json

      # ── 3. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Lint ──────────────────────────────────────────────────────────────
      - name: Run ESLint
        run: npm run lint

      # ── 5. Type-check ────────────────────────────────────────────────────────
      - name: TypeScript type-check
        run: npx tsc --noEmit

      # ── 6. Install Vercel CLI ────────────────────────────────────────────────
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ── 7. Pull project config from Vercel ───────────────────────────────────
      # Downloads .vercel/project.json so the CLI knows which project to target.
      # We inject env vars directly from GitHub Secrets in step 8 instead of
      # relying on the Vercel dashboard — giving full control in one place.
      - name: Pull Vercel project config
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── 8. Write .env.production.local from the PRODUCTION secret ───────────
      # The PRODUCTION secret is a multiline block of KEY=VALUE pairs —
      # exactly the contents of a .env file. Written directly to disk so
      # `vercel build --prod` picks it up automatically. Nothing is logged.
      - name: Write production env file
        run: printf '%s\n' "$PRODUCTION_ENV" > .env.production.local
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION }}

      # ── 9. Build ─────────────────────────────────────────────────────────────
      # `vercel build --prod` uses the .env.production.local written above.
      # If the build fails the whole workflow stops — deploy never runs.
      - name: Build with Vercel (production)
        run: |
          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── 10. Deploy prebuilt output ───────────────────────────────────────────
      # --prebuilt ships exactly what step 9 verified — Vercel does not rebuild.
      # Captures the live URL and writes it to GITHUB_OUTPUT for the summary.
      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed → $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── 11. Post-deploy summary ──────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "## ✅ Deployment successful" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| URL | ${{ steps.deploy.outputs.deploy_url }} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Deployment failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the logs above for the failing step." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| Branch | \`main\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
