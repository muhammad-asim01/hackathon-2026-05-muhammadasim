name: Deploy Frontend → Vercel (Production)

# ── Trigger ───────────────────────────────────────────────────────────────────
# Runs ONLY when code lands on main (direct push or merged PR).
# All other branches are ignored.
on:
  push:
    branches:
      - main
    paths:
      - "main-project/frontend/**"
      - ".github/workflows/deploy-frontend.yml"

# ── Permissions ───────────────────────────────────────────────────────────────
permissions:
  contents: read
  deployments: write

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: main-project/frontend

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node ────────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: main-project/frontend/package-lock.json

      # ── 3. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Lint ──────────────────────────────────────────────────────────────
      - name: Run ESLint
        run: npm run lint

      # ── 5. Type-check ────────────────────────────────────────────────────────
      - name: TypeScript type-check
        run: npx tsc --noEmit

      # ── 6. Install Vercel CLI ────────────────────────────────────────────────
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ── 7. Pull env vars + project config from Vercel ────────────────────────
      # This downloads .vercel/project.json and creates .env.production.local
      # with all environment variables configured in the Vercel dashboard.
      - name: Pull Vercel environment & project config
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── 8. Build ─────────────────────────────────────────────────────────────
      # `vercel build --prod` mirrors exactly what Vercel's servers will run,
      # using the env vars pulled in the previous step.
      - name: Build with Vercel (production)
        run: |
          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── 9. Deploy prebuilt output ────────────────────────────────────────────
      # --prebuilt skips re-building on Vercel's side — ships exactly what
      # step 8 verified. Captures the deployment URL for the summary.
      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── 10. Post deploy summary ──────────────────────────────────────────────
      - name: Write job summary
        run: |
          echo "## Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | ${{ steps.deploy.outputs.deploy_url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`main\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
