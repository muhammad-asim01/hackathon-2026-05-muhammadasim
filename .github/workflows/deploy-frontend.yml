name: Deploy Frontend → Vercel (Production)

# ── Trigger ───────────────────────────────────────────────────────────────────
# Runs ONLY when code lands on main (direct push or merged PR).
# All other branches are ignored.
on:
  push:
    branches:
      - main
    paths:
      - "main-project/frontend/**"
      - ".github/workflows/deploy-frontend.yml"

# ── Permissions ───────────────────────────────────────────────────────────────
permissions:
  contents: read
  deployments: write

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    environment: production

    # ── Production domain (single source of truth) ───────────────────────────
    env:
      PRODUCTION_URL: https://saftai.vercel.app

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node ────────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: main-project/frontend/package-lock.json

      # ── 3. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        working-directory: main-project/frontend
        run: npm ci

      # ── 4. Lint ──────────────────────────────────────────────────────────────
      - name: Run ESLint
        working-directory: main-project/frontend
        run: npm run lint

      # ── 5. Type-check ────────────────────────────────────────────────────────
      - name: TypeScript type-check
        working-directory: main-project/frontend
        run: npx tsc --noEmit

      # ── 6. Install Vercel CLI ────────────────────────────────────────────────
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ── 7. Pull Vercel project config ────────────────────────────────────────
      # Run from repo ROOT so Vercel resolves paths relative to the git root.
      # --cwd tells Vercel the actual frontend source is in main-project/frontend.
      - name: Pull Vercel project config
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --cwd main-project/frontend \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── 8. Write .env.production.local (build-time vars) ─────────────────────
      # NEXT_PUBLIC_* vars must be present at build time — baked into JS bundle.
      # Auth URL vars are also written here so Next.js picks them up at build.
      - name: Write production env file
        run: |
          # Base vars from GitHub Variable (NEXT_PUBLIC_*, etc.)
          printf '%s\n' "$PRODUCTION_ENV" > main-project/frontend/.env.production.local
          # Always override with canonical production URLs
          {
            echo "NEXT_PUBLIC_APP_URL=$PRODUCTION_URL"
            echo "NEXTAUTH_URL=$PRODUCTION_URL"
            echo "AUTH_URL=$PRODUCTION_URL"
          } >> main-project/frontend/.env.production.local
        env:
          PRODUCTION_ENV: ${{ vars.PRODUCTION }}

      # ── 9. Sync generic env vars → Vercel dashboard (runtime vars) ───────────
      # Server-side vars are read by Vercel serverless functions at runtime.
      # Values are stripped of \r to prevent Windows CRLF corrupting the secret.
      - name: Sync env vars to Vercel dashboard
        run: |
          while IFS='=' read -r key value; do
            # Strip leading/trailing whitespace and carriage returns
            key="${key// /}"
            key="${key//$'\r'/}"
            value="${value//$'\r'/}"
            [[ -z "$key" || "$key" == \#* ]] && continue
            echo "Syncing: $key"
            printf '%s' "$value" | vercel env add "$key" production \
              --cwd main-project/frontend \
              --token=${{ secrets.VERCEL_TOKEN }} \
              --force 2>&1 || true
          done <<< "$PRODUCTION_ENV"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PRODUCTION_ENV: ${{ vars.PRODUCTION }}

      # ── 10. Sync auth-critical secrets → Vercel dashboard ────────────────────
      # These are stored as proper GitHub Secrets (not the plain PRODUCTION var)
      # and are always forced to the canonical production values.
      - name: Sync auth secrets to Vercel dashboard
        run: |
          # Production domain — always correct regardless of PRODUCTION var contents
          for var in NEXTAUTH_URL AUTH_URL NEXT_PUBLIC_APP_URL; do
            printf '%s' "$PRODUCTION_URL" | vercel env add "$var" production \
              --cwd main-project/frontend \
              --token=${{ secrets.VERCEL_TOKEN }} \
              --force 2>&1 || true
          done

          # Shared auth secret (frontend ↔ backend JWT signing)
          # tr -d '\r' strips any Windows carriage return from the secret value
          printf '%s' "${{ secrets.NEXTAUTH_SECRET }}" | tr -d '\r' | vercel env add NEXTAUTH_SECRET production \
            --cwd main-project/frontend \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --force 2>&1 || true
          printf '%s' "${{ secrets.NEXTAUTH_SECRET }}" | tr -d '\r' | vercel env add AUTH_SECRET production \
            --cwd main-project/frontend \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --force 2>&1 || true

          # Google OAuth credentials — tr -d '\r' prevents %0D corruption in OAuth flow
          printf '%s' "${{ secrets.GOOGLE_CLIENT_ID }}" | tr -d '\r' | vercel env add GOOGLE_CLIENT_ID production \
            --cwd main-project/frontend \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --force 2>&1 || true
          printf '%s' "${{ secrets.GOOGLE_CLIENT_SECRET }}" | tr -d '\r' | vercel env add GOOGLE_CLIENT_SECRET production \
            --cwd main-project/frontend \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --force 2>&1 || true
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── 11. Build ─────────────────────────────────────────────────────────────
      # --cwd points Vercel at the frontend folder from the repo root.
      # Uses .env.production.local written in step 8.
      # If the build fails the workflow stops — deploy never runs.
      - name: Build with Vercel (production)
        run: |
          vercel build \
            --prod \
            --cwd main-project/frontend \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── 12. Deploy prebuilt output ───────────────────────────────────────────
      # --prebuilt ships exactly what step 11 verified — Vercel does not rebuild.
      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy \
            --prebuilt \
            --prod \
            --cwd main-project/frontend \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed → $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── 13. Post-deploy summary ──────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "## ✅ Deployment successful" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| URL | ${{ steps.deploy.outputs.deploy_url }} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Deployment failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the logs above for the failing step." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| Branch | \`main\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
