name: Deploy Frontend → Vercel (Production)

# ── Trigger ───────────────────────────────────────────────────────────────────
# Runs ONLY when code lands on main (direct push or merged PR).
# All other branches are ignored.
on:
  push:
    branches:
      - main
    paths:
      - "main-project/frontend/**"
      - ".github/workflows/deploy-frontend.yml"

# ── Permissions ───────────────────────────────────────────────────────────────
permissions:
  contents: read
  deployments: write

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node ────────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: main-project/frontend/package-lock.json

      # ── 3. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        working-directory: main-project/frontend
        run: npm ci

      # ── 4. Lint ──────────────────────────────────────────────────────────────
      - name: Run ESLint
        working-directory: main-project/frontend
        run: npm run lint

      # ── 5. Type-check ────────────────────────────────────────────────────────
      - name: TypeScript type-check
        working-directory: main-project/frontend
        run: npx tsc --noEmit

      # ── 6. Install Vercel CLI ────────────────────────────────────────────────
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ── 7. Pull Vercel project config ────────────────────────────────────────
      # Run from repo ROOT so Vercel resolves paths relative to the git root.
      # --cwd tells Vercel the actual frontend source is in main-project/frontend.
      - name: Pull Vercel project config
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --cwd main-project/frontend \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── 8. Write .env.production.local (build-time vars) ─────────────────────
      # NEXT_PUBLIC_* vars must be present at build time — baked into JS bundle.
      # Written into the frontend directory so vercel build picks it up.
      - name: Write production env file
        run: printf '%s\n' "$PRODUCTION_ENV" > main-project/frontend/.env.production.local
        env:
          PRODUCTION_ENV: ${{ vars.PRODUCTION }}

      # ── 9. Sync env vars → Vercel dashboard (runtime vars) ───────────────────
      # Server-side vars (NEXTAUTH_SECRET, GOOGLE_CLIENT_*, etc.) are read by
      # Vercel serverless functions at runtime from the Vercel dashboard.
      # This step auto-pushes every KEY=VALUE from GitHub → Vercel so you only
      # ever update one place (GitHub) and Vercel stays in sync.
      - name: Sync env vars to Vercel dashboard
        run: |
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" == \#* ]] && continue
            echo "Syncing: $key"
            printf '%s' "$value" | vercel env add "$key" production \
              --cwd main-project/frontend \
              --token=${{ secrets.VERCEL_TOKEN }} \
              --force 2>&1 || true
          done <<< "$PRODUCTION_ENV"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PRODUCTION_ENV: ${{ vars.PRODUCTION }}

      # ── 10. Build ─────────────────────────────────────────────────────────────
      # --cwd points Vercel at the frontend folder from the repo root.
      # Uses .env.production.local written in step 8.
      # If the build fails the workflow stops — deploy never runs.
      - name: Build with Vercel (production)
        run: |
          vercel build \
            --prod \
            --cwd main-project/frontend \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── 11. Deploy prebuilt output ───────────────────────────────────────────
      # --prebuilt ships exactly what step 10 verified — Vercel does not rebuild.
      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy \
            --prebuilt \
            --prod \
            --cwd main-project/frontend \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed → $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── 12. Post-deploy summary ──────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "## ✅ Deployment successful" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| URL | ${{ steps.deploy.outputs.deploy_url }} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Deployment failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the logs above for the failing step." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| Branch | \`main\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
