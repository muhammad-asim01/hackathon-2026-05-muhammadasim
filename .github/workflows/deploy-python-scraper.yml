name: Deploy Python Scraper

on:
  push:
    branches: [main]
    paths:
      - "main-project/server/python-scraper/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy FastAPI Scraper → Railway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy python-scraper service
        working-directory: main-project/server/python-scraper
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service python-scraper \
            --environment production \
            --detach \
            -m "Python scraper ${{ github.sha }}"
