[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run build && npx prisma generate && npx playwright install chromium --with-deps"

[deploy]
startCommand = "npx prisma migrate deploy && node dist/interface/http/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
