# Railway service config — rootDirectory is main-project/server on Railway.
# Uses Dockerfile at backend/Dockerfile for a deterministic Node.js build.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
